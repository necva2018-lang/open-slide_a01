name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /open-slide_a01/
      # 講師站加上簡易密碼畫面
      - run: node tools/add-gate.mjs
      # GitHub Pages 沒有伺服器端轉址，直接開 /s/<id> 會 404；用 404.html 回到單頁應用
      - run: cp dist/index.html dist/404.html
      # 學員站：只打包 student/public.json 列出的簡報，輸出到 dist/student/
      - run: npx vite build --config student/vite.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
